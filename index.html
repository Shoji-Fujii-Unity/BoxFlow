<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0e1220">
<title>BoxFlow</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<!-- デザイン用外部参照はこのフォントのみ（オフライン時はシステムフォントに自動フォールバック） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1220; --panel:#171d33; --panel2:#1d2440; --board:#10152a;
    --wallA:#46507c; --wallB:#333b60; --wallHi:rgba(255,255,255,.14);
    --floor1:#1b2238; --floor2:#1e2641;
    --gold:#ffc85c; --gold2:#ff9d5c; --blue:#63b4ff; --blue2:#2f8fd6;
    --green:#42d57c; --text:#eef2ff; --dim:#93a0c2; --line:rgba(255,255,255,.08);
    --r:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:"Zen Maru Gothic",-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    overscroll-behavior:none;}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(60% 42% at 18% 8%, rgba(99,180,255,.10), transparent 62%),
      radial-gradient(52% 40% at 86% 22%, rgba(255,200,92,.08), transparent 60%),
      radial-gradient(65% 50% at 50% 108%, rgba(66,213,124,.07), transparent 60%);}
  .num{font-family:"Outfit","Zen Maru Gothic",sans-serif;}
  #app{max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 6px) 14px calc(env(safe-area-inset-bottom) + 8px);}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px;}
  .logo{font-family:"Outfit",sans-serif;font-weight:800;font-size:23px;letter-spacing:.5px;}
  .logo span{background:linear-gradient(120deg,var(--gold),var(--gold2));
    -webkit-background-clip:text;background-clip:text;color:transparent;}
  .tools{display:flex;gap:7px;align-items:center;}
  .iconbtn{width:36px;height:36px;display:grid;place-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;color:var(--text);cursor:pointer;transition:.15s;}
  .iconbtn:active{transform:scale(.92);background:var(--panel2);}
  select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;
    padding:7px 6px;font-size:13px;cursor:pointer;font-family:inherit;}
  .ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ic.fill{fill:currentColor;stroke:none;}

  /* ---------- status ---------- */
  #statusbar{display:flex;align-items:center;gap:8px;padding:6px 2px;font-size:13px;color:var(--dim);}
  #lvChip{display:flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);
    border-radius:999px;padding:5px 11px;color:var(--text);font-size:13px;max-width:52%;overflow:hidden;}
  #lvChip b{font-family:"Outfit",sans-serif;color:var(--gold);font-size:14px;}
  #lvChip .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #statusbar .spacer{flex:1;}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 10px;white-space:nowrap;}
  .chip b{color:var(--gold);font-family:"Outfit",sans-serif;}
  .nav{display:flex;gap:5px;}
  .navbtn{width:32px;height:30px;display:grid;place-items:center;background:var(--panel);
    border:1px solid var(--line);border-radius:9px;color:var(--text);cursor:pointer;}
  .navbtn:disabled{opacity:.25;cursor:default;}
  .navbtn .ic{width:15px;height:15px;}

  /* ---------- board ---------- */
  #boardwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none;}
  #board{position:relative;background:var(--board);border-radius:var(--r);
    box-shadow:0 14px 40px rgba(0,0,0,.45), inset 0 0 0 1px var(--line);padding:8px;}
  #cells{display:grid;position:relative;}
  .cell{width:var(--cs);height:var(--cs);position:relative;}
  .f0{background:var(--floor1);} .f1{background:var(--floor2);}
  .wall{background:linear-gradient(180deg,var(--wallA),var(--wallB));
    box-shadow:inset 0 2px 0 var(--wallHi), inset 0 -4px 6px rgba(0,0,0,.35);border-radius:3px;}
  .goal::after{content:"";position:absolute;inset:0;margin:auto;width:40%;height:40%;border-radius:50%;
    border:3px solid var(--gold);opacity:.9;
    box-shadow:0 0 10px rgba(255,200,92,.55), inset 0 0 6px rgba(255,200,92,.4);
    animation:goalpulse 2.2s ease-in-out infinite;}
  .goal::before{content:"";position:absolute;inset:0;margin:auto;width:12%;height:12%;border-radius:50%;
    background:var(--gold);opacity:.8;}
  @keyframes goalpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  #sprites{position:absolute;inset:8px;pointer-events:none;}
  .box,.player{position:absolute;left:0;top:0;width:var(--cs);height:var(--cs);
    transition:transform .13s ease-out;will-change:transform;}
  .box .v{position:absolute;inset:10%;border-radius:16%;
    background:linear-gradient(160deg,#c97e3f,#a1552a);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.25), inset 0 -4px 8px rgba(0,0,0,.35), 0 3px 5px rgba(0,0,0,.35);}
  .box .v::before,.box .v::after{content:"";position:absolute;background:rgba(0,0,0,.22);}
  .box .v::before{left:0;right:0;top:42%;height:14%;}
  .box .v::after{top:0;bottom:0;left:42%;width:14%;}
  .box.on .v{background:linear-gradient(160deg,#57e08c,#2fa96a);
    box-shadow:inset 0 3px 0 rgba(255,255,255,.3), inset 0 -4px 8px rgba(0,0,0,.3), 0 0 14px rgba(66,213,124,.55);}
  .box.pop .v{animation:boxpop .35s ease-out;}
  @keyframes boxpop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
  .player .v{position:absolute;inset:11%;border-radius:50%;
    background:radial-gradient(circle at 34% 28%, #8fc9ff, var(--blue) 55%, var(--blue2));
    box-shadow:0 3px 8px rgba(0,0,0,.4), inset 0 -4px 6px rgba(0,0,0,.25), 0 0 12px rgba(99,180,255,.35);}
  .player .face{position:absolute;left:26%;top:26%;width:48%;height:48%;transition:transform .13s;}
  .player .face::before,.player .face::after{content:"";position:absolute;width:22%;height:26%;
    border-radius:40%;background:#10233d;top:30%;}
  .player .face::before{left:16%;} .player .face::after{right:16%;}
  .player[dir=up] .face{transform:translateY(-16%);}
  .player[dir=down] .face{transform:translateY(16%);}
  .player[dir=left] .face{transform:translateX(-16%);}
  .player[dir=right] .face{transform:translateX(16%);}

  /* ---------- footer / d-pad ---------- */
  footer{padding:10px 0 4px;}
  .row{display:flex;gap:10px;justify-content:center;margin-top:9px;align-items:center;}
  .big{width:64px;height:56px;background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);color:var(--text);border-radius:16px;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,0,0,.35);transition:.1s;}
  .big .ic{width:24px;height:24px;stroke-width:2.4;margin:auto;display:block;color:var(--blue);}
  .big:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35);}
  .act{flex:1;max-width:150px;display:flex;align-items:center;justify-content:center;gap:6px;
    font-size:14px;font-family:inherit;border-radius:12px;background:var(--panel);color:var(--text);
    border:1px solid var(--line);padding:11px 4px;cursor:pointer;transition:.1s;}
  .act .ic{width:16px;height:16px;}
  .act:active{transform:scale(.96);background:var(--panel2);}

  /* ---------- overlays ---------- */
  .ovl{position:fixed;inset:0;background:rgba(7,10,20,.78);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:10;}
  .ovl.show{display:flex;}
  .dialog{background:linear-gradient(180deg,var(--panel2),var(--panel));
    border:1px solid var(--line);border-radius:20px;padding:26px 22px;text-align:center;
    max-width:360px;width:88%;box-shadow:0 18px 60px rgba(0,0,0,.6);animation:dlg .3s ease-out;}
  @keyframes dlg{from{transform:translateY(14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .dialog h2{margin:0 0 12px;color:var(--gold);font-size:22px;}
  .dialog p{margin:0 0 4px;line-height:1.7;font-size:14px;color:var(--dim);white-space:pre-line;}
  .dialog .btns{margin-top:16px;}
  .dialog button{background:linear-gradient(120deg,var(--gold),var(--gold2));color:#241a05;border:none;
    border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;margin:4px;cursor:pointer;
    font-family:inherit;transition:.1s;}
  .dialog button:active{transform:scale(.95);}
  .dialog button.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line);font-weight:500;}
  .stars{display:flex;gap:10px;justify-content:center;margin:4px 0 14px;}
  .stars svg{width:44px;height:44px;fill:#2a3352;transform:scale(.6);opacity:0;}
  .stars svg.earn{fill:var(--gold);filter:drop-shadow(0 0 8px rgba(255,200,92,.6));
    animation:starpop .45s cubic-bezier(.2,1.6,.4,1) forwards;}
  .stars svg.earn:nth-child(2){animation-delay:.15s;}
  .stars svg.earn:nth-child(3){animation-delay:.3s;}
  @keyframes starpop{to{transform:scale(1);opacity:1}}

  /* level select */
  #lvOvl .dialog{max-width:420px;width:92%;padding:18px 16px;}
  .lvhead{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .lvhead h2{margin:0;font-size:18px;flex:1;text-align:left;}
  #lvProg{font-size:12px;color:var(--dim);}
  #lvProg b{color:var(--gold);font-family:"Outfit",sans-serif;}
  #lvBar{height:6px;background:#0d1226;border-radius:99px;overflow:hidden;margin:8px 2px 12px;}
  #lvBarIn{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:99px;
    transition:width .4s ease;}
  #lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-height:56vh;overflow-y:auto;}
  .tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:8px 4px 7px;cursor:pointer;color:var(--text);font-family:inherit;transition:.12s;
    display:flex;flex-direction:column;align-items:center;gap:4px;min-height:64px;}
  .tile:active{transform:scale(.94);}
  .tile .no{font-family:"Outfit",sans-serif;font-weight:700;font-size:15px;}
  .tile .ts{display:flex;gap:1px;}
  .tile .ts svg{width:12px;height:12px;fill:#39456c;}
  .tile .ts svg.g{fill:var(--gold);}
  .tile .tb{font-size:10px;color:var(--dim);font-family:"Outfit",sans-serif;line-height:1;}
  .tile.done{border-color:rgba(66,213,124,.35);background:linear-gradient(180deg,rgba(66,213,124,.10),var(--panel));}
  .tile.cur{outline:2px solid var(--blue);outline-offset:1px;}
  .tile.locked{opacity:.38;cursor:default;}
  .tile.locked:active{transform:none;}
  .tile .lk{width:16px;height:16px;color:var(--dim);margin-top:6px;}
  .hint{font-size:11px;color:var(--dim);margin:10px 2px 0;text-align:left;}

  #cfx{position:fixed;inset:0;z-index:20;pointer-events:none;}

  @media (prefers-reduced-motion: reduce){
    .box,.player{transition:none;}
    .goal::after,.stars svg,.dialog{animation:none!important;transform:none;opacity:1;}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 10h11a4.5 4.5 0 0 1 0 9H9"/><path d="M8 6 4 10l4 4"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.22L7 14.14 2 9.27l6.91-1.01L12 2z"/></symbol>
  </defs>
</svg>

<div id="app">
  <header>
    <div class="logo">Box<span>Flow</span></div>
    <div class="tools">
      <button class="iconbtn" id="lvBtn" aria-label="level select"><svg class="ic"><use href="#i-grid"/></svg></button>
      <select id="langSel" aria-label="language">
        <option value="ja">🇯🇵 日本語</option>
        <option value="en">🇬🇧 English</option>
        <option value="zh">🇨🇳 中文</option>
      </select>
      <button class="iconbtn" id="soundBtn" aria-label="sound"><svg class="ic"><use id="soundIco" href="#i-sound"/></svg></button>
    </div>
  </header>

  <div id="statusbar">
    <span id="lvChip"><b id="lvNo"></b><span class="t" id="lvTitle"></span></span>
    <span class="spacer"></span>
    <span class="chip" id="moveChip"></span>
    <span class="chip" id="bestChip" style="display:none"></span>
    <span class="nav">
      <button class="navbtn" id="prevBtn" aria-label="prev level"><svg class="ic"><use href="#i-left"/></svg></button>
      <button class="navbtn" id="nextBtn" aria-label="next level"><svg class="ic"><use href="#i-right"/></svg></button>
    </span>
  </div>

  <div id="boardwrap"><div id="board"><div id="cells"></div><div id="sprites"></div></div></div>

  <footer>
    <div class="row">
      <button class="act" id="undoBtn"><svg class="ic"><use href="#i-undo"/></svg><span></span></button>
      <button class="act" id="resetBtn"><svg class="ic"><use href="#i-reset"/></svg><span></span></button>
    </div>
    <div class="row">
      <div style="width:64px"></div>
      <button class="big" data-d="up" aria-label="up"><svg class="ic"><use href="#i-up"/></svg></button>
      <div style="width:64px"></div>
    </div>
    <div class="row">
      <button class="big" data-d="left" aria-label="left"><svg class="ic"><use href="#i-left"/></svg></button>
      <button class="big" data-d="down" aria-label="down"><svg class="ic"><use href="#i-down"/></svg></button>
      <button class="big" data-d="right" aria-label="right"><svg class="ic"><use href="#i-right"/></svg></button>
    </div>
  </footer>
</div>

<canvas id="cfx"></canvas>

<!-- ---------- level select ---------- -->
<div class="ovl" id="lvOvl"><div class="dialog">
  <div class="lvhead">
    <h2 id="lvSelTitle"></h2>
    <span id="lvProg"></span>
    <button class="iconbtn" id="lvClose" aria-label="close"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <div id="lvBar"><div id="lvBarIn"></div></div>
  <div id="lvGrid"></div>
  <p class="hint" id="lvHint"></p>
</div></div>

<!-- ---------- win ---------- -->
<div class="ovl" id="winOvl"><div class="dialog">
  <h2 id="winTitle"></h2>
  <div class="stars" id="winStars">
    <svg viewBox="0 0 24 24"><use href="#i-star"/></svg>
    <svg viewBox="0 0 24 24"><use href="#i-star"/></svg>
    <svg viewBox="0 0 24 24"><use href="#i-star"/></svg>
  </div>
  <p id="winText"></p>
  <div class="btns">
    <button id="replayBtn" class="ghost"></button>
    <button id="nextLevelBtn"></button>
  </div>
</div></div>

<script>
"use strict";
/* ---------- 多言語 ---------- */
const I18N = {
  ja:{moves:"移動 {n}", best:"ベスト {b}", undo:"待避", reset:"やり直し",
      lvSel:"レベル選択", prog:"クリア {a}/{t}", hint:"前の面をクリアすると次の面が解放されます。",
      winTitle:"🎉 クリア！", winSub:"手数 {m}　｜　ベスト {b}　｜　パル {p}",
      replay:"もう一度", next:"次のレベル ▶", alldone:"🏆 全レベルクリア！", locked:"🔒"},
  en:{moves:"Moves {n}", best:"Best {b}", undo:"Undo", reset:"Restart",
      lvSel:"Levels", prog:"Cleared {a}/{t}", hint:"Clear a level to unlock the next one.",
      winTitle:"🎉 Cleared!", winSub:"Moves {m}　·　Best {b}　·　Par {p}",
      replay:"Play again", next:"Next ▶", alldone:"🏆 All levels cleared!", locked:"🔒"},
  zh:{moves:"步数 {n}", best:"最佳 {b}", undo:"撤销", reset:"重来",
      lvSel:"关卡选择", prog:"已通关 {a}/{t}", hint:"通关上一关即可解锁下一关。",
      winTitle:"🎉 过关！", winSub:"步数 {m}　·　最佳 {b}　·　标准 {p}",
      replay:"再玩一次", next:"下一关 ▶", alldone:"🏆 全部通关！", locked:"🔒"}
};

/* ---------- レベル定義 ----------
   # 壁 / . ゴール / $ 箱 / @ プレイヤー / スペース 床
   par = ソルバー検証済みの目標手数（push最適解の実手数） ---------- */
/*== LEVELS START ==*/
const LEVELS = [

  { par:30, d:"★★★", t:{ja:"肘の通路",en:"Elbow Room",zh:"肘形通道"}, rows:[

  { par:35, d:"★★★", t:{ja:"上へ上へ通路",en:"Up the Aisle",zh:"向上通道"}, rows:[

  { par:43, d:"★★★", t:{ja:"中央の島",en:"Central Isle",zh:"中央小岛"}, rows:[
    "#########",

/* ---------- 起動時検証 ---------- */
function validateLevels(){
  let ok=true;
  LEVELS.forEach((lv,i)=>{
    const rows=lv.rows, errs=[];
    const w=Math.max(...rows.map(r=>r.length));
    if(rows.some(r=>r.length!==w)) errs.push(`行長不一致 (max=${w})`);
    let boxes=0,goals=0,players=0;
    rows.forEach((r,y)=>{ [...r].forEach((ch,x)=>{
      if(ch==="$")boxes++; else if(ch===".")goals++; else if(ch==="@")players++;
      else if(ch!=="#"&&ch!==" ") errs.push(`不正文字 '${ch}' @行${y}列${x}`); }); });
    if(boxes!==goals) errs.push(`箱(${boxes})≠ゴール(${goals})`);
    if(players!==1)   errs.push(`プレイヤー数=${players}`);
    if(errs.length){ ok=false; console.error(`[L${i+1}]`, ...errs); }
  });
  if(ok) console.info(`validateLevels: OK (${LEVELS.length} levels)`);
}
validateLevels();

/* ---------- 保存（v2、v1 からのマイグレーション付き） ---------- */
const SAVE_KEY="boxflow_save_v2", OLD_KEY="boxflow_save_v1";
/* 旧 20 面のインデックス(0始まり) → 新 30 面でのインデックス */
const MIGRATE=[0,1,2,3,4,7,8,10,11,13,14,15,17,18,20,22,24,25,27,29];
/* レイアウトを差し替えた旧面（途中セーブ状態は移行しない）: 旧18面 逆流配分 / 旧19面 六枠サービス列 */
const LAYOUT_CHANGED_OLD=new Set([17,18]);
let save={v:2, lang:null, sound:true, levels:{}};
function starFor(mv,par){ return (mv==null||par==null)?0 : mv<=par?3 : mv<=Math.ceil(par*1.4)?2 : 1; }
try{
  const s=localStorage.getItem(SAVE_KEY);
  if(s){ save=Object.assign(save,JSON.parse(s)); }
  else{
    const o=localStorage.getItem(OLD_KEY);
    if(o){
      const old=JSON.parse(o);
      save.lang=old.lang??null; save.sound=old.sound!==false;
      for(const k in (old.levels||{})){
        const oi=+k; if(!(oi>=0&&oi<MIGRATE.length)) continue;
        const ni=MIGRATE[oi], e=old.levels[k];
        const best=(typeof e.best==="number")?e.best:null;
        save.levels[ni]={ done:!!e.done, best,
          stars:e.done?starFor(best,LEVELS[ni]?.par):0,
          state:LAYOUT_CHANGED_OLD.has(oi)?null:(e.state??null) };
      }
    }
  }
}catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ---------- 状態 ---------- */
let lang = save.lang || (navigator.language||"en").slice(0,2);
if(!I18N[lang]) lang="en";
let soundOn = save.sound !== false;
let lastDir="down";

let levelIdx=0;
let ROWS=0, COLS=0, wallG=[], goalG=[];
let player=null, boxes=[], moves=0, undoStack=[], won=false;
let startPlayer=null, startBoxes=[];

function parseLevel(i){
  const rows=LEVELS[i].rows;
  ROWS=rows.length; COLS=Math.max(...rows.map(r=>r.length));
  wallG=[]; goalG=[]; startPlayer=null; startBoxes=[];
  for(let r=0;r<ROWS;r++){
    wallG.push([]); goalG.push([]);
    for(let c=0;c<COLS;c++){
      const ch = c<rows[r].length ? rows[r][c] : "#";
      wallG[r].push(ch==="#");
      goalG[r].push(ch===".");
      if(ch==="@") startPlayer=[r,c];
      if(ch==="$") startBoxes.push([r,c]);
    }
  }
}
const svKey=i=>String(i);
const isUnlocked=i=> i===0 || !!save.levels[svKey(i-1)]?.done;
const svOf=i=> save.levels[svKey(i)] || (save.levels[svKey(i)]={done:false,best:null,stars:0,state:null});

function loadLevelState(){
  const sv=save.levels[svKey(levelIdx)];
  const okCell=(r,c)=>r>=0&&r<ROWS&&c>=0&&c<COLS&&!wallG[r][c];
  const st=sv?.state;
  if(st && !sv.done && Array.isArray(st.boxes) && Array.isArray(st.player)
     && st.boxes.length===startBoxes.length
     && okCell(st.player[0],st.player[1])
     && st.boxes.every(b=>Array.isArray(b)&&okCell(b[0],b[1]))){
    player=st.player.slice();
    boxes=st.boxes.map(b=>b.slice());
    moves=st.moves||0;
  }else{
    player=startPlayer.slice();
    boxes=startBoxes.map(b=>b.slice());
    moves=0;
  }
  undoStack=[]; won=false;
}
function resetLevel(){
  player=startPlayer.slice();
  boxes=startBoxes.map(b=>b.slice());
  moves=0; undoStack=[];
  buildSprites();
  saveState();
}
function saveState(){
  svOf(levelIdx).state={player:player.slice(), boxes:boxes.map(b=>b.slice()), moves};
  persist();
}
function gotoLevel(i){
  levelIdx=Math.max(0,Math.min(TOTAL-1,i));
  parseLevel(levelIdx); loadLevelState();
  buildBoard(); buildSprites(); fit(); updateLabels();
}

function setPos(e,r,c,anim=true){
  e.style.transition = anim? "" : "none";

}
function syncOn(){
  boxes.forEach((b,i)=>{
    const on=goalG[b[0]][b[1]];

    if(on && !e.classList.contains("on")){

/* ---------- サウンド ---------- */
let actx=null, gestured=false;
function ensureCtx(){
  if(!gestured) return null;
  if(!actx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    try{ actx=new AC(); }catch(e){ return null; }
  }
  if(actx.state==="suspended") actx.resume().catch(()=>{});
  return actx;
}
function unlockAudio(){
  gestured=true; ensureCtx();
  if(actx && actx.state==="running")
    ["click","keydown"].forEach(ev=>window.removeEventListener(ev,unlockAudio,true));
}
["click","keydown","pointerdown"].forEach(ev=>window.addEventListener(ev,unlockAudio,{capture:true}));
function tone(freq,dur=.08,type="triangle",vol=.12,slide=0){
  if(!soundOn) return;
  const c=ensureCtx();
  if(!c || c.state!=="running") return;
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,c.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),c.currentTime+dur);
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
const sndMove =()=>tone(300,.05,"triangle",.09,-120);
const sndPush =()=>tone(150,.1,"sawtooth",.1,-40);
const sndGoal =()=>{ tone(660,.09,"sine",.16); setTimeout(()=>tone(880,.12,"sine",.16),70); };
const sndUndo =()=>tone(240,.06,"triangle",.1);
const sndWin  =()=>{ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.2,"sine",.18),i*130)); };
const buzz=ms=>{ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

/* ---------- ゲームロジック ---------- */
const DIRS={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]};
function move(dir){
  if(won) return;
  lastDir=dir; playerEl.dir=dir;
  const [dr,dc]=DIRS[dir];
  const nr=player[0]+dr, nc=player[1]+dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS||wallG[nr][nc]) { tone(120,.05,"sine",.05); return; }
  const bi=boxes.findIndex(b=>b[0]===nr&&b[1]===nc);
  if(bi>=0){
    const br=nr+dr, bc=nc+dc;
    if(br<0||br>=ROWS||bc<0||bc>=COLS||wallG[br][bc]
       || boxes.some(b=>b[0]===br&&b[1]===bc)) { tone(120,.05,"sine",.05); return; }
    undoStack.push({p:player.slice(), b:boxes.map(x=>x.slice()), m:moves});
    boxes[bi]=[br,bc]; player=[nr,nc]; moves++;
    sndPush(); buzz(18);
  }else{
    undoStack.push({p:player.slice(), b:boxes.map(x=>x.slice()), m:moves});
    player=[nr,nc]; moves++; sndMove();
  }
  placeAll(); syncOn();
  if(bi>=0 && goalG[boxes[bi][0]][boxes[bi][1]]) sndGoal();
  saveState(); updateLabels();
  checkWin();
}
function undo(){
  if(won) return;
  const s=undoStack.pop(); if(!s) return;
  player=s.p; boxes=s.b; moves=s.m; sndUndo();
  placeAll(); syncOn(); saveState(); updateLabels();
}
function checkWin(){
  if(won) return;
  if(!(boxes.length>0 && boxes.every(b=>goalG[b[0]][b[1]]))) return;
  won=true;
  const sv=svOf(levelIdx), par=LEVELS[levelIdx].par;
  const isNew=!sv.done;
  sv.done=true;
  if(sv.best==null||moves<sv.best) sv.best=moves;
  sv.stars=Math.max(sv.stars||0, starFor(sv.best,par));
  persist(); updateLabels();
  sndWin(); buzz([20,40,20]);
  showStars(sv.stars);
  document.getElementById("winText").textContent=fill(I18N[lang].winSub,{m:moves,b:sv.best,p:par});
  const hasNext=levelIdx+1<TOTAL;
  document.getElementById("nextLevelBtn").style.display=hasNext?"":"none";
  if(!hasNext && LEVELS.every((_,i)=>save.levels[svKey(i)]?.done))
    document.getElementById("winTitle").textContent=I18N[lang].alldone;
  confetti();
  setTimeout(()=>document.getElementById("winOvl").classList.add("show"),420);
}
function fill(s,vars){ for(const k in vars) s=s.replaceAll("{"+k+"}",vars[k]); return s; }
const t=(k,v)=>fill(I18N[lang][k],v||{});
function showStars(n){
  document.querySelectorAll("#winStars svg").forEach((s,i)=>{
    s.classList.remove("earn"); void s.getBoundingClientRect();
    if(i<n) requestAnimationFrame(()=>s.classList.add("earn"));
  });
}

/* ---------- 紙吹雪 ---------- */
const cfx=document.getElementById("cfx"), cctx=cfx.getContext("2d");
let cfxParts=[], cfxRaf=null;
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  cfx.width=innerWidth; cfx.height=innerHeight;
  const cols=["#ffc85c","#63b4ff","#42d57c","#ff9d5c","#ff7b9c","#eef2ff"];
  cfxParts=[];
  for(let i=0;i<140;i++){
    const a=Math.random()*Math.PI*2, sp=3+Math.random()*7;
    cfxParts.push({x:cfx.width/2, y:cfx.height*.38,
      vx:Math.cos(a)*sp*1.6, vy:Math.sin(a)*sp-4,
      w:4+Math.random()*5, h:6+Math.random()*7,
      rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.3,
      c:cols[i%cols.length], life:1});
  }
  if(!cfxRaf) cfxLoop(performance.now());
}
function cfxLoop(ts){
  cctx.clearRect(0,0,cfx.width,cfx.height);
  let alive=0;
  for(const p of cfxParts){
    p.vy+=.18; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.vx*=.995;
    if(p.y<cfx.height+20){ alive++;
      cctx.save(); cctx.translate(p.x,p.y); cctx.rotate(p.rot);
      cctx.fillStyle=p.c; cctx.fillRect(-p.w/2,-p.h/2,p.w,p.h); cctx.restore(); }
  }
  if(alive) cfxRaf=requestAnimationFrame(cfxLoop);
  else { cfxRaf=null; cctx.clearRect(0,0,cfx.width,cfx.height); }
}

      const st=sv.stars||(sv.done?starFor(sv.best,lv.par):0);
      b.innerHTML=`<span class="no">${i+1}</span>`+
        `<span class="ts">${[0,1,2].map(k=>`<svg viewBox="0 0 24 24" class="${k<st?"g":""}"><use href="#i-star"/></svg>`).join("")}</span>`+
        (sv.best!=null?`<span class="tb">${sv.best}</span>`:"");
      b.title=lv.t[lang]||lv.t.en;
      b.onclick=()=>{ closeLv(); gotoLevel(i); };
    }else{
      b.innerHTML=`<span class="no">${i+1}</span><svg class="ic lk"><use href="#i-lock"/></svg>`;
    }
    grid.appendChild(b);
  });
}
const openLv=()=>{ renderLvGrid(); lvOvl.classList.add("show"); };
const closeLv=()=>lvOvl.classList.remove("show");

/* ---------- 入力 ---------- */
const KEYMAP={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
              w:"up",s:"down",a:"left",d:"right"};
window.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeLv(); return; }
  if(lvOvl.classList.contains("show")) return;
  const winShown=document.getElementById("winOvl").classList.contains("show");
  const d=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
  if(d){ e.preventDefault(); move(d); }
  else if(e.key==="z"||e.key==="u") undo();
  else if((e.key==="r"||e.key==="R") && !winShown){
    won=false; resetLevel(); updateLabels(); tone(300,.08,"triangle",.12);
  }
  else if((e.key==="l"||e.key==="L") && !winShown) openLv();
  else if(e.key==="m"||e.key==="M") toggleSound();
});
document.querySelectorAll("[data-d]").forEach(btn=>{
  btn.addEventListener("pointerdown",()=>move(btn.dataset.d));
});
let tsx=0,tsy=0;
const bw=document.getElementById("boardwrap");
bw.addEventListener("touchstart",e=>{ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; },{passive:true});
bw.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
  move(Math.abs(dx)>Math.abs(dy) ? (dx>0?"right":"left") : (dy>0?"down":"up"));
});

/* ---------- UI イベント ---------- */
document.getElementById("undoBtn").onclick=undo;
document.getElementById("resetBtn").onclick=()=>{ resetLevel(); updateLabels(); tone(300,.08,"triangle",.12); };
document.getElementById("prevBtn").onclick=()=>gotoLevel(levelIdx-1);
document.getElementById("nextBtn").onclick=()=>{ if(isUnlocked(levelIdx+1)) gotoLevel(levelIdx+1); };
document.getElementById("lvBtn").onclick=openLv;
document.getElementById("lvClose").onclick=closeLv;
lvOvl.addEventListener("click",e=>{ if(e.target===lvOvl) closeLv(); });
document.getElementById("replayBtn").onclick=()=>{
  document.getElementById("winOvl").classList.remove("show");
  won=false; resetLevel(); updateLabels();
};
document.getElementById("nextLevelBtn").onclick=()=>{
  document.getElementById("winOvl").classList.remove("show");
  won=false; gotoLevel(levelIdx+1);
};
const soundIco=document.getElementById("soundIco");
function refreshSound(){ soundIco.setAttribute("href", soundOn?"#i-sound":"#i-mute"); }
function toggleSound(){ soundOn=!soundOn; save.sound=soundOn; persist(); refreshSound(); if(soundOn) tone(500,.08,"sine",.15); }
document.getElementById("soundBtn").onclick=toggleSound;
const langSel=document.getElementById("langSel");
langSel.value=lang;
langSel.onchange=()=>{ lang=langSel.value; save.lang=lang; persist();
  document.documentElement.lang=lang; updateLabels(); };

/* ---------- 起動 ---------- */
refreshSound();
document.documentElement.lang=lang;
/* 最初の未クリア面に自動で合わせる */
let startIdx=0;
for(let i=0;i<TOTAL;i++){ if(!save.levels[svKey(i)]?.done){ startIdx=i; break; } }
gotoLevel(startIdx);
window.addEventListener("resize",fit);
</script>
</body>
</html>
