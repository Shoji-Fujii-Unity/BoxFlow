<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BoxFlow</title>
<style>
  :root{
    --bg:#1a1b2e; --panel:#242645; --board:#12131f; --wall:#3d3f66; --walltop:#4a4d7a;
    --floor:#20223c; --goal:#ffce4d; --box:#b5651d; --boxtop:#d98e4a; --boxok:#3ecf6e;
    --player:#5db9ff; --text:#eef0ff; --accent:#ffce4d; --btn:#34375c; --btnhi:#454872;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif;
    overscroll-behavior:none;}
  #app{max-width:430px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);}
  header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;}
  .logo{font-weight:800;font-size:20px;letter-spacing:1px;}
  .logo span{color:var(--accent);}
  .tools{display:flex;gap:6px;align-items:center;}
  select,.iconbtn{background:var(--btn);color:var(--text);border:none;border-radius:8px;
    padding:6px 8px;font-size:14px;cursor:pointer;}
  .iconbtn:active{background:var(--btnhi);}
  #statusbar{display:flex;justify-content:space-between;align-items:center;padding:4px 2px;font-size:14px;color:#aab;}
  #statusbar b{color:var(--accent);}
  .nav{display:flex;gap:4px;align-items:center;}
  .navbtn{background:var(--btn);color:var(--text);border:none;border-radius:8px;width:34px;height:30px;
    font-size:15px;cursor:pointer;}
  .navbtn:disabled{opacity:.25;cursor:default;}
  #boardwrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;touch-action:none;}
  #board{display:grid;background:var(--board);border-radius:10px;padding:6px;gap:0;position:relative;}
  .cell{width:var(--cs);height:var(--cs);position:relative;display:flex;align-items:center;justify-content:center;}
  .floor{background:var(--floor);}
  .wall{background:var(--wall);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25), inset 0 3px 0 var(--walltop);}
  .goal::after{content:"";width:34%;height:34%;border-radius:50%;
    background:var(--goal);opacity:.85;box-shadow:0 0 10px var(--goal);}
  .box,.player{position:absolute;width:78%;height:78%;transition:top .12s ease,left .12s ease;}
  .box{left:11%;top:11%;background:var(--box);border-radius:6px;
    box-shadow:inset 0 4px 0 var(--boxtop), inset 0 -5px 0 rgba(0,0,0,.3);}
  .box.on{background:var(--boxok);box-shadow:inset 0 4px 0 #7fe8a3, inset 0 -5px 0 rgba(0,0,0,.3), 0 0 12px var(--boxok);}
  .player{left:11%;top:11%;background:var(--player);border-radius:50% 50% 45% 45%;
    box-shadow:inset 0 -5px 0 #2f8fd6, 0 0 10px rgba(93,185,255,.6);}
  footer{padding:8px 0 12px;}
  .row{display:flex;gap:8px;justify-content:center;margin-top:8px;}
  .big{background:var(--btn);border:none;color:var(--text);border-radius:12px;
    font-size:22px;width:64px;height:56px;cursor:pointer;}
  .big:active{background:var(--btnhi);}
  .act{flex:1;max-width:120px;font-size:15px;border-radius:10px;background:var(--btn);
    color:var(--text);border:none;padding:12px 4px;cursor:pointer;}
  .act:active{background:var(--btnhi);}
  #overlay{position:fixed;inset:0;background:rgba(10,10,25,.86);display:none;
    align-items:center;justify-content:center;z-index:10;}
  #overlay.show{display:flex;}
  .dialog{background:var(--panel);border-radius:16px;padding:28px 24px;text-align:center;
    max-width:330px;width:86%;box-shadow:0 10px 40px rgba(0,0,0,.5);}
  .dialog h2{margin:0 0 10px;color:var(--accent);}
  .dialog p{margin:0 0 18px;line-height:1.6;font-size:15px;white-space:pre-line;}
  .dialog button{background:var(--accent);color:#222;border:none;border-radius:10px;
    padding:12px 18px;font-size:15px;font-weight:700;margin:4px;cursor:pointer;}
  .dialog button.ghost{background:var(--btn);color:var(--text);}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">Box<span>Flow</span></div>
    <div class="tools">
      <select id="langSel" aria-label="language">
        <option value="ja">🇯🇵 日本語</option>
        <option value="en">🇬🇧 English</option>
        <option value="zh">🇨🇳 中文</option>
      </select>
      <button class="iconbtn" id="soundBtn" aria-label="sound">🔊</button>
    </div>
  </header>

  <div id="statusbar">
    <span id="lvLabel"></span>
    <span class="nav">
      <button class="navbtn" id="prevBtn">◀</button>
      <button class="navbtn" id="nextBtn">▶</button>
    </span>
    <span id="moveLabel"></span>
  </div>

  <div id="boardwrap"><div id="board"></div></div>

  <footer>
    <div class="row">
      <div style="width:64px"></div>
      <button class="big" data-d="up">▲</button>
      <div style="width:64px"></div>
    </div>
    <div class="row">
      <button class="big" data-d="left">◀</button>
      <button class="big" data-d="down">▼</button>
      <button class="big" data-d="right">▶</button>
    </div>
    <div class="row">
      <button class="act" id="undoBtn"></button>
      <button class="act" id="resetBtn"></button>
    </div>
  </footer>
</div>

<div id="overlay"><div class="dialog">
  <h2 id="winTitle"></h2>
  <p id="winText"></p>
  <button id="replayBtn" class="ghost"></button>
  <button id="nextLevelBtn"></button>
</div></div>

<script>
"use strict";
/* ---------- 多言語 ---------- */
const I18N = {
  ja:{level:"レベル {n}/{t}", moves:"移動 {n}", undo:"↩ 待避", reset:"🔄 やり直し",
      winTitle:"🎉 クリア！", winText:"レベル {n} を {m} 手でクリア！\nベスト: {b} 手",
      replay:"もう一度遊ぶ", next:"次のレベル ▶", alldone:"🏆 全レベルクリア！"},
  en:{level:"Level {n}/{t}", moves:"Moves {n}", undo:"↩ Undo", reset:"🔄 Restart",
      winTitle:"🎉 Cleared!", winText:"You cleared Level {n} in {m} moves!\nBest: {b}",
      replay:"Play again", next:"Next level ▶", alldone:"🏆 All levels cleared!"},
  zh:{level:"第 {n}/{t} 关", moves:"步数 {n}", undo:"↩ 撤销", reset:"🔄 重来",
      winTitle:"🎉 过关！", winText:"你用 {m} 步通过了第 {n} 关！\n最佳: {b}",
      replay:"再玩一次", next:"下一关 ▶", alldone:"🏆 全部通关！"}
};

/* ---------- レベル定義（全17面） ----------
   # 壁 / . ゴール / $ 箱 / @ プレイヤー / スペース 床 */
const LEVELS = [
/* L1: 真下だけ */
[ "#######",
  "#     #",
  "# $$  #",
  "#  @  #",
  "# ..  #",
  "#######" ],

/* L2: 横に押す */
[ "########",
  "#      #",
  "#  $ . #",
  "#      #",
  "# .  $ #",
  "#  @   #",
  "########" ],

/* L3: 角を曲がる */
[ "#######",
  "#     #",
  "#  $  #",
  "#  # $#",
  "#.   .#",
  "#  @  #",
  "#######" ],

/* L4: 動順（邪魔箱を先にどかす） */
[ "########",
  "#      #",
  "#  $$  #",
  "#  #   #",
  "# ..   #",
  "#    @ #",
  "########" ],

/* L5: 2箱各1旋回・ルートの選択 */
[ "#########",
  "#   .   #",
  "# $   $ #",
  "#       #",
  "#   .   #",
  "#  @    #",
  "#########" ],

/* L6: 「上に押す」 */
[ "#########",
  "#  ...  #",
  "#       #",
  "#  $ $  #",
  "# $     #",
  "#    @  #",
  "#########" ],

/* L7: ずれた3箱・下段横滑り */
[ "#########",
  "#       #",
  "# $ #   #",
  "#  ..$  #",
  "#       #",
  "#   @   #",
  "#########" ],

/* L8: 3箱一直線ゴール（順序） */
[ "#########",
  "#       #",
  "#  ...  #",
  "#       #",
  "# $ $ $ #",
  "#    @  #",
  "#########" ],

/* L9: 壁際ゴールを埋める順序 */
[ "#########",
  "#       #",
  "# $ $ $ #",
  "#       #",
  "#   @   #",
  "###...###" ],

/* L10: 4箱・動順＋旋回混在 */
[ "##########",
  "#        #",
  "# $$   $ #",
  "#  ....  #",
  "#  $     #",
  "#    @   #",
  "##########" ],

/* L11: 3箱・共有通路の衝突 */
[ "#########",
  "#   .   #",
  "# $   $ #",
  "#   #   #",
  "#  .$.  #",
  "#   @   #",
  "#########" ],

/* L12: 四隅対称アプローチ ★★★★☆ */
[ "#########",
  "#       #",
  "# $   $ #",
  "# ....  #",
  "# $   $ #",
  "#    @  #",
  "#########" ],

/* L13: H3「四隅集結」★★★★☆ */
[ "###########",
  "#         #",
  "# $     $ #",
  "#         #",
  "#   ##    #",
  "#  ....   #",
  "# $     $ #",
  "#    @    #",
  "###########" ],

/* L14: 二重扉のボトルネック（新）★★★★☆+ */
[ "##########",
  "#    #   #",
  "# $  # . #",
  "# $    . #",
  "#      . #",
  "# $  #   #",
  "# @  #   #",
  "##########" ],

/* L15: H1「二重迂回」★★★★★ */
[ "##########",
  "#        #",
  "# $    $ #",
  "# #    # #",
  "#        #",
  "# ..  .. #",
  "# $    $ #",
  "#   @    #",
  "##########" ],

/* L16: H2「六枠回転」★★★★★+ */
[ "############",
  "#          #",
  "# $ $   $$ #",
  "# ##  ##   #",
  "#          #",
  "#  ......  #",
  "# $  $     #",
  "#     @    #",
  "############" ],

/* L17: 五通路・サービス列 ★★★★★+ */   /* 全9行 × 幅14文字 */
[ "##############",
  "#            #",
  "# $    #    .#",
  "#   $       .#",
  "# $    #    .#",
  "#   $       .#",
  "# $    #    .#",
  "#  @   #     #",
  "##############" ],

/* L18: 逆流配分 ★★★★★+ */
[ "#############",
  "#  ......   #",
  "### ##### ###",
  "#           #",
  "# $ $  $$   #",
  "# $       $ #",
  "#     @     #",
  "#############" ],

/* L19: 六枠サービス列 ★★★★★++ */      /* 全10行 × 幅14文字 */
[ "##############",
  "#            #",
  "# $    #    .#",
  "#   $       .#",
  "# $    #    .#",
  "#   $   #   .#",
  "# $         .#",
  "#   $   #   .#",
  "# @          #",
  "##############" ],

/* L20: 元祖倉庫番レベル1風（最終面） */ /* 全11行 × 幅19文字で統一 */
[ "    #####          ",
  "    #   #          ",
  "    #$  #          ",
  "  ###  $##         ",
  "  #  $ $ #         ",
  "### # ## #   ######",
  "#   # ## #####  ..#",
  "# $  $          ..#",
  "##### ### #@##  ..#",
  "    #     #########",
  "    #######        " ]
];
const TOTAL = LEVELS.length;

/* ---------- レベル定義の起動時検証 ---------- */
function validateLevels(){
  let ok=true;
  LEVELS.forEach((rows,i)=>{
    const errs=[];
    const w=Math.max(...rows.map(r=>r.length));
    if(rows.some(r=>r.length!==w)) errs.push(`行長の不一致 (max=${w})`);
    let boxes=0,goals=0,players=0;
    rows.forEach((r,y)=>{
      [...r].forEach((ch,x)=>{
        if(ch==="$")boxes++;
        else if(ch===".")goals++;
        else if(ch==="@")players++;
        else if(ch!=="#"&&ch!==" "){
          errs.push(`不正文字 '${ch}' (U+${ch.charCodeAt(0).toString(16)}) @行${y}列${x}`);
        }
      });
    });
    if(boxes!==goals) errs.push(`箱(${boxes})とゴール(${goals})の数不一致`);
    if(players!==1)   errs.push(`プレイヤー数=${players} (必須1)`);
    if(errs.length){ ok=false; console.error(`[L${i+1}]`, ...errs); }
  });
  if(ok) console.info(`validateLevels: OK (${LEVELS.length} levels)`);
}
validateLevels();

/* ---------- 保存 ---------- */
const SAVE_KEY="boxflow_save_v1";
let save={lang:null, sound:true, levels:{}};
try{ const s=localStorage.getItem(SAVE_KEY); if(s) save=Object.assign(save,JSON.parse(s)); }catch(e){}
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} }

/* ---------- 状態 ---------- */
let lang = save.lang || (navigator.language||"en").slice(0,2);
if(!I18N[lang]) lang="en";
let soundOn = save.sound !== false;

let levelIdx = 0;
let ROWS=0, COLS=0, wallG=[], goalG=[];
let player=null, boxes=[], moves=0, undoStack=[];
let startPlayer=null, startBoxes=[];

function parseLevel(i){
  const rows=LEVELS[i];
  ROWS=rows.length; COLS=Math.max(...rows.map(r=>r.length));
  wallG=[]; goalG=[]; startPlayer=null; startBoxes=[];
  for(let r=0;r<ROWS;r++){
    wallG.push([]); goalG.push([]);
    for(let c=0;c<COLS;c++){
      const ch = c<rows[r].length ? rows[r][c] : "#";   // 右端外側は壁扱い
      wallG[r].push(ch==="#");
      goalG[r].push(ch===".");
      if(ch==="@") startPlayer=[r,c];
      if(ch==="$") startBoxes.push([r,c]);
    }
  }
}
function svKey(i){ return String(i); }
function isUnlocked(i){ return i===0 || !!save.levels[svKey(i-1)]?.done; }

function loadLevelState(){
  const sv=save.levels[svKey(levelIdx)];
  if(sv && !sv.done && sv.state && Array.isArray(sv.state.boxes)){
    player=sv.state.player.slice();
    boxes=sv.state.boxes.map(b=>b.slice());
    moves=sv.state.moves||0;
  }else{
    player=startPlayer.slice();
    boxes=startBoxes.map(b=>b.slice());
    moves=0;
  }
  undoStack=[];
}
function resetLevel(persistIt=true){
  player=startPlayer.slice();
  boxes=startBoxes.map(b=>b.slice());
  moves=0; undoStack=[];
  if(persistIt) saveState();
}
function saveState(){
  const k=svKey(levelIdx);
  const sv=save.levels[k]||{};
  save.levels[k]={ done:!!sv.done, best:sv.best ?? null,
    state:{player:player.slice(), boxes:boxes.map(b=>b.slice()), moves} };
  persist();
}
function gotoLevel(i){
  levelIdx=Math.max(0,Math.min(TOTAL-1,i));
  parseLevel(levelIdx); loadLevelState(); render();
}

/* ---------- 描画 ---------- */
const boardEl=document.getElementById("board");
function render(){
  const wrap=document.getElementById("boardwrap");
  const cs=Math.floor(Math.min((wrap.clientWidth-24)/COLS,(wrap.clientHeight-24)/ROWS));
  boardEl.style.setProperty("--cs",cs+"px");
  boardEl.style.gridTemplateColumns=`repeat(${COLS}, ${cs}px)`;
  boardEl.innerHTML="";
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const d=document.createElement("div");
    d.className="cell "+(wallG[r][c]?"wall":"floor");
    if(goalG[r][c]) d.classList.add("goal");
    const b=boxes.find(bb=>bb[0]===r&&bb[1]===c);
    if(b){ const e=document.createElement("div");
      e.className="box"+(goalG[r][c]?" on":""); d.appendChild(e); }
    if(player[0]===r&&player[1]===c){ const e=document.createElement("div"); e.className="player"; d.appendChild(e); }
    boardEl.appendChild(d);
  }
  updateLabels();
}
function t(key,vars){ let s=I18N[lang][key]; for(const k in vars) s=s.replaceAll("{"+k+"}",vars[k]); return s; }
function updateLabels(){
  document.getElementById("lvLabel").textContent=t("level",{n:levelIdx+1,t:TOTAL});
  document.getElementById("moveLabel").textContent=t("moves",{n:moves});
  document.getElementById("undoBtn").textContent=t("undo");
  document.getElementById("resetBtn").textContent=t("reset");
  document.getElementById("replayBtn").textContent=t("replay");
  document.getElementById("nextLevelBtn").textContent=t("next");
  document.getElementById("winTitle").textContent=t("winTitle");
  document.getElementById("prevBtn").disabled = levelIdx===0;
  document.getElementById("nextBtn").disabled = !isUnlocked(levelIdx+1);
}

/* ---------- サウンド（自動再生ポリシー準拠・最終版） ---------- */
let actx=null, gestured=false;

function ensureCtx(){
  if(!gestured) return null;                 // ジェスチャ確認済みのみ生成
  if(!actx){
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    try{ actx=new AC(); }catch(e){ return null; }
  }
  if(actx.state==="suspended") actx.resume().catch(()=>{});
  return actx;
}

/* クリック/タップ確定・キー入力のみで起動（アクティベーション保証） */
function unlockAudio(){
  gestured=true;
  ensureCtx();                               // 信頼ジェスチャ内でのみ生成
  if(actx && actx.state==="running"){
    ["click","keydown"].forEach(ev=>
      window.removeEventListener(ev,unlockAudio,true));
  }
}
["click","keydown"].forEach(ev=>
  window.addEventListener(ev,unlockAudio,{capture:true}));

function tone(freq,dur=0.08,type="square",vol=0.15){
  if(!soundOn) return;
  const c=ensureCtx();
  if(!c || c.state!=="running") return;      // 未起動時は無音（警告も出さない）
  try{
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
    o.connect(g).connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  }catch(e){}
}
const sndMove=()=>tone(320,0.05,"triangle",0.12);
const sndPush=()=>tone(180,0.09,"sawtooth",0.14);
const sndGoal=()=>tone(660,0.15,"sine",0.2);
const sndWin =()=>{ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,0.18,"sine",0.2),i*140)); };

/* ---------- ゲームロジック ---------- */
const DIRS={up:[-1,0],down:[1,0],left:[0,-1],right:[0,1]};
function move(dir){
  const [dr,dc]=DIRS[dir];
  const nr=player[0]+dr, nc=player[1]+dc;
  if(nr<0||nr>=ROWS||nc<0||nc>=COLS||wallG[nr][nc]) return;
  const bi=boxes.findIndex(b=>b[0]===nr&&b[1]===nc);
  if(bi>=0){
    const br=nr+dr, bc=nc+dc;
    if(br<0||br>=ROWS||bc<0||bc>=COLS||wallG[br][bc]
       || boxes.some(b=>b[0]===br&&b[1]===bc)) return;
    undoStack.push({p:player.slice(), b:boxes.map(x=>x.slice()), m:moves});
    boxes[bi]=[br,bc]; player=[nr,nc]; moves++;
    if(goalG[br][bc]) sndGoal(); else sndPush();
  }else{
    undoStack.push({p:player.slice(), b:boxes.map(x=>x.slice()), m:moves});
    player=[nr,nc]; moves++; sndMove();
  }
  render(); saveState();
  checkWin();
}
function undo(){
  const s=undoStack.pop(); if(!s) return;
  player=s.p; boxes=s.b; moves=s.m; tone(240,0.06,"triangle",0.1);
  render(); saveState();
}
let won=false;
function checkWin(){
  if(won) return;
  const done=boxes.length>0 && boxes.every(b=>goalG[b[0]][b[1]]);
  if(!done) return;
  won=true; sndWin();
  const k=svKey(levelIdx);
  const sv=save.levels[k]||{};
  sv.done=true; sv.best=(sv.best==null)?moves:Math.min(sv.best,moves);
  save.levels[k]=sv; persist();
  document.getElementById("winText").textContent=t("winText",{n:levelIdx+1,m:moves,b:sv.best});
  const hasNext = levelIdx+1<TOTAL;
  document.getElementById("nextLevelBtn").style.display=hasNext?"":"none";
  if(!hasNext) document.getElementById("winTitle").textContent=t("alldone");
  setTimeout(()=>document.getElementById("overlay").classList.add("show"),350);
}

/* ---------- 入力 ---------- */
const KEYMAP={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
              w:"up",s:"down",a:"left",d:"right"};
window.addEventListener("keydown",e=>{
  const d=KEYMAP[e.key]||KEYMAP[e.key.toLowerCase()];
  if(d){ e.preventDefault(); move(d); }
  else if(e.key==="z"||e.key==="u") undo();
});
document.querySelectorAll("[data-d]").forEach(btn=>{
  btn.addEventListener("pointerdown",()=>move(btn.dataset.d));   // preventDefault なし（gesture-safe）
});
let tsx=0,tsy=0;
const bw=document.getElementById("boardwrap");
bw.addEventListener("touchstart",e=>{ tsx=e.touches[0].clientX; tsy=e.touches[0].clientY; },{passive:true});
bw.addEventListener("touchend",e=>{
  const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.max(Math.abs(dx),Math.abs(dy))<24) return;
  move(Math.abs(dx)>Math.abs(dy) ? (dx>0?"right":"left") : (dy>0?"down":"up"));
});

/* ---------- UI ---------- */
document.getElementById("undoBtn").onclick=undo;
// ✅ 修正後
document.getElementById("resetBtn").onclick=()=>{ won=false; resetLevel(true); render(); tone(300,0.08,"triangle",0.12); };
document.getElementById("prevBtn").onclick=()=>gotoLevel(levelIdx-1);
document.getElementById("nextBtn").onclick=()=>{ if(isUnlocked(levelIdx+1)) gotoLevel(levelIdx+1); };
document.getElementById("replayBtn").onclick=()=>{
  document.getElementById("overlay").classList.remove("show");
  won=false; resetLevel(false); render();
};
document.getElementById("nextLevelBtn").onclick=()=>{
  document.getElementById("overlay").classList.remove("show");
  won=false; gotoLevel(levelIdx+1);
};
const soundBtn=document.getElementById("soundBtn");
function refreshSound(){ soundBtn.textContent=soundOn?"🔊":"🔇"; }
soundBtn.onclick=()=>{ soundOn=!soundOn; save.sound=soundOn; persist(); refreshSound(); if(soundOn) tone(500,0.08,"sine",0.15); };
const langSel=document.getElementById("langSel");
langSel.value=lang;
langSel.onchange=()=>{ lang=langSel.value; save.lang=lang; persist(); updateLabels(); };

/* ---------- 起動 ---------- */
refreshSound();
gotoLevel(0);
window.addEventListener("resize",render);
</script>
</body>
